# Short wiring/checkpoint test, not a trained playing-strength model.
behaviors:
  ChessV1:
    trainer_type: sac
    hyperparameters:
      batch_size: 16
      buffer_size: 2048
      buffer_init_steps: 32
      learning_rate: 0.0003
      learning_rate_schedule: constant
      tau: 0.005
      steps_per_update: 4
      save_replay_buffer: true
      init_entcoef: 0.05
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    self_play:
      save_steps: 128
      team_change: 256
      swap_steps: 64
      window: 3
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    max_steps: 256
    time_horizon: 32
    summary_freq: 64
    checkpoint_interval: 128
    keep_checkpoints: 2
engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 0
env_settings:
  num_envs: 1
torch_settings:
  device: cpu
