behaviors:
  ChessV1:
    trainer_type: sac
    hyperparameters:
      batch_size: 64
      buffer_size: 50000
      buffer_init_steps: 1000
      learning_rate: 0.0003
      learning_rate_schedule: constant
      tau: 0.005
      steps_per_update: 4
      save_replay_buffer: true
      init_entcoef: 0.05
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    self_play:
      save_steps: 10000
      team_change: 20000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    max_steps: 10000000
    time_horizon: 64
    summary_freq: 10000
    checkpoint_interval: 50000
    keep_checkpoints: 5
engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 0
env_settings:
  num_envs: 1
torch_settings:
  device: cuda
# Success-based promotion is controlled by Tools/TrainChessSuccess.py.
# Plain mlagents-learn intentionally stays at stage 0.
environment_parameters:
  curriculum_stage: 0
