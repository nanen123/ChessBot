# Evaluation positions are validation data used for promotion, not final blind tests.
positions: Data/Curriculum/Generalization/positions.jsonl
seed: 20261001
samples_per_stage: 128
evaluation_version: 5
capture_samples_per_difficulty: 64
capture_training_samples: 64
capture_minimum_episodes: 128
# Promotion thresholds lowered by 10 percentage points; retention unchanged.
capture_promotion_thresholds: [0.80, 0.75, 0.75]
capture_retention_thresholds: [0.80, 0.75, 0.75]
maximum_plies: [1, 12, 3, 100, 256, 512]
evaluation_interval: 50000
minimum_stage_steps: 100000
consecutive_passes: 2
minimum_episodes: 256
# Index 0 below is reserved; capture_* thresholds control all stage-0 difficulties.
promotion_thresholds: [0.85, 0.60, 0.75, 0.60, 0.45]
# Previously passed lessons must not regress below these floors.
retention_thresholds: [0.75, 0.60, 0.75, 0.60, 0.45]

training_samples_per_stage: 32
generalization_samples: 32
independent_minimum_episodes: 64
require_independent_validation: true
require_category_validation: true
category_minimum_episodes: 16

# Changes the resume fingerprint when the runtime training distribution changes.
training_distribution_version: 8

# Automatic focused review while learning 0-C; both validation sets must recover.
capture_b_repair:
  enabled: true
  recovery_threshold: 0.80
  recovery_passes: 2
